<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Arrivals | Bow Service Marketplace</title>
  <meta name="description" content="Recently added items and items on the way at Bow Service Marketplace.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236f2b7c'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='Segoe UI,Arial' font-weight='800'>B</text></svg>">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body data-page="arrivals">
  <main class="wrap" id="page">
    <section class="page-head">
      <p class="eyebrow">New arrivals</p>
      <h1>Fresh finds &amp; coming soon</h1>
      <p>Recently added listings, plus items that have been ordered and are on the way.</p>
    </section>

    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="recent" aria-selected="true">✨ Recently added <span class="n" id="nRecent"></span></button>
      <button class="tab" role="tab" data-tab="ordered" aria-selected="false">📦 On order <span class="n" id="nOrdered"></span></button>
      <button class="tab" role="tab" data-tab="processing" aria-selected="false">🚚 Processing <span class="n" id="nProcessing"></span></button>
    </div>

    <div class="toolbar">
      <select id="aRange" aria-label="Added within">
        <option value="7">Added in the last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="all">Any time</option>
      </select>
      <select id="aCat" aria-label="Category"><option value="">All categories</option></select>
      <span class="grow"></span>
      <label class="check"><input type="checkbox" id="aSold"> Show sold items</label>
    </div>
    <div class="result-line"><span id="aResult">Loading…</span></div>
    <div class="grid" id="grid"></div>
    <div class="load-more"><button class="btn btn-ghost" id="loadMore" hidden>Show more</button></div>
  </main>
  <script src="../config.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/pages.js"></script>
</body>
</html>
