<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories | Bow Service Marketplace</title>
  <meta name="description" content="Browse Bow Service Marketplace by category.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236f2b7c'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='Segoe UI,Arial' font-weight='800'>B</text></svg>">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body data-page="categories">
  <main class="wrap" id="page">
    <section class="page-head">
      <p class="eyebrow">Categories</p>
      <h1>Shop by category</h1>
      <p>Pick a category to see everything in it.</p>
    </section>
    <div class="toolbar" style="margin-top:22px">
      <input type="search" class="field" id="cSearch" placeholder="Find a category…" aria-label="Find a category" style="flex:1;min-width:200px">
      <select id="cSort" aria-label="Sort"><option value="count">Most items</option><option value="name">A–Z</option></select>
      <label class="check"><input type="checkbox" id="cSold"> Count sold items</label>
    </div>
    <div class="cat-grid" id="catGrid"></div>
  </main>
  <script src="../config.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/pages.js"></script>
</body>
</html>
