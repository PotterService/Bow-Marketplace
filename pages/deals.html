<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deals | Bow Service Marketplace</title>
  <meta name="description" content="The biggest savings at Bow Service Marketplace, compared with Amazon prices.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236f2b7c'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='Segoe UI,Arial' font-weight='800'>B</text></svg>">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body data-page="deals">
  <main class="wrap" id="page">
    <section class="page-head">
      <p class="eyebrow">Deals</p>
      <h1>Today’s best deals</h1>
      <p>Every item here is priced below its Amazon price. Biggest savings first.</p>
      <div class="head-stats">
        <div class="stat"><b id="dCount">–</b><span>Deals</span></div>
        <div class="stat"><b id="dBest">–</b><span>Biggest discount</span></div>
        <div class="stat"><b id="dSave">–</b><span>Total savings</span></div>
      </div>
    </section>

    <section class="section" id="topDeal" hidden></section>

    <section class="section">
      <div class="toolbar">
        <select id="dMin" aria-label="Minimum discount">
          <option value="0">Any discount</option>
          <option value="25">25% off or more</option>
          <option value="50">50% off or more</option>
          <option value="70">70% off or more</option>
        </select>
        <select id="dCat" aria-label="Category"><option value="">All categories</option></select>
        <select id="dSort" aria-label="Sort">
          <option value="discount">Biggest discount</option>
          <option value="savings">Most money saved</option>
          <option value="priceLow">Price: low to high</option>
          <option value="newest">Newest first</option>
        </select>
        <span class="grow"></span>
        <label class="check"><input type="checkbox" id="dNow"> Available now only</label>
      </div>
      <div class="result-line"><span id="dResult">Loading deals…</span></div>
      <div class="grid" id="grid"></div>
      <div class="load-more"><button class="btn btn-ghost" id="loadMore" hidden>Show more deals</button></div>
    </section>
  </main>
  <script src="../config.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/pages.js"></script>
</body>
</html>
